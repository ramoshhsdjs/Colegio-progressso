<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colégio Progresso - Horários</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* CABEÇALHO IGUAL AO ESCOLA.HTML */
    header {
      background-color: #ffffff;
      border-bottom: 3px solid #dc2626;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #dc2626;
    }

    .school-info h1 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #dc2626;
    }

    .school-info p {
      font-size: 0.75rem;
      color: #1e3a8a;
      font-weight: 700;
    }

    .btn-voltar {
      background-color: #dc2626;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      flex: 1;
      padding: 20px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .section-title {
      font-size: 0.95rem;
      color: #475569;
      margin: 15px 0 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* 1. SELEÇÃO DO TIPO (PROVAS OU ESCOLARES) */
    .tipo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tipo-btn {
      background-color: #ffffff;
      border: 2px solid #dc2626;
      border-radius: 12px;
      padding: 14px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #dc2626;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .tipo-btn.ativo {
      background-color: #dc2626;
      color: #ffffff;
    }

    /* 2. GRADE DO 1 AO 9 */
    .classes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .class-btn {
      background-color: #ffffff;
      border: 2px solid #dc2626;
      border-radius: 10px;
      padding: 12px 5px;
      font-weight: 800;
      font-size: 0.9rem;
      color: #0f172a;
      cursor: pointer;
      text-align: center;
    }

    .class-btn.ativo {
      background-color: #fef2f2;
      border-color: #991b1b;
      color: #dc2626;
    }

    /* 3. ÁREA DE EXIBIÇÃO DA FOTO / AVISO */
    .display-card {
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .display-card h3 {
      font-size: 1rem;
      color: #dc2626;
      margin-bottom: 12px;
    }

    .img-horario {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
    }

    /* AVISO QUANDO NÃO TIVER FOTO */
    .sem-foto {
      color: #64748b;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 20px;
      background-color: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      width: 100%;
    }

    .sem-foto span {
      display: block;
      font-size: 2rem;
      margin-bottom: 5px;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.75rem;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-box">
      <img src="../logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/50?text=CP'">
      <div class="school-info">
        <h1>COLÉGIO PROGRESSO</h1>
        <p>Horários e Calendários</p>
      </div>
    </div>
    <button class="btn-voltar" onclick="voltarMenu()">Voltar</button>
  </header>

  <main>
    <!-- PASSO 1: Escolher Tipo -->
    <div class="section-title">1. Selecione a Opção</div>
    <div class="tipo-grid">
      <button class="tipo-btn ativo" id="btn-escolares" onclick="selecionarTipo('escolares')">
        📅 Horários Escolares
      </button>
      <button class="tipo-btn" id="btn-provas" onclick="selecionarTipo('provas')">
        📝 Horários de Prova
      </button>
    </div>

    <!-- PASSO 2: Escolher a Classe (1 ao 9) -->
    <div class="section-title">2. Selecione a Classe</div>
    <div class="classes-grid">
      <button class="class-btn ativo" id="c-1" onclick="selecionarClasse(1)">1ª Classe</button>
      <button class="class-btn" id="c-2" onclick="selecionarClasse(2)">2ª Classe</button>
      <button class="class-btn" id="c-3" onclick="selecionarClasse(3)">3ª Classe</button>
      <button class="class-btn" id="c-4" onclick="selecionarClasse(4)">4ª Classe</button>
      <button class="class-btn" id="c-5" onclick="selecionarClasse(5)">5ª Classe</button>
      <button class="class-btn" id="c-6" onclick="selecionarClasse(6)">6ª Classe</button>
      <button class="class-btn" id="c-7" onclick="selecionarClasse(7)">7ª Classe</button>
      <button class="class-btn" id="c-8" onclick="selecionarClasse(8)">8ª Classe</button>
      <button class="class-btn" id="c-9" onclick="selecionarClasse(9)">9ª Classe</button>
    </div>

    <!-- PASSO 3: Resultado (Foto ou Mensagem) -->
    <div class="display-card">
      <h3 id="titulo-horario">Horário Escolar - 1ª Classe</h3>
      <div id="conteudo-horario" style="width: 100%;">
        <!-- Vai ser preenchido dinamicamente pelo JavaScript -->
      </div>
    </div>
  </main>

  <footer>
    &copy; Colégio Progresso - Todos os direitos reservados.
  </footer>

  <script>
    // VARIAVEL COM OS CAMINHOS DAS FOTOS (Coloque o nome da imagem quando tiver uma)
    // Se deixar "" (vazio), o sistema mostra automaticamente "Ainda não foi adicionado"
    const imagensHorarios = {
      escolares: {
        1: "", // Exemplo de uso futuro: "fotos/escolar_1.jpg"
        2: "",
        3: "",
        4: "",
        5: "",
        6: "",
        7: "",
        8: "",
        9: ""
      },
      provas: {
        1: "",
        2: "",
        3: "",
        4: "",
        5: "",
        6: "",
        7: "",
        8: "",
        9: ""
      }
    };

    let tipoAtual = 'escolares';
    let classeAtual = 1;

    function atualizarTela() {
      // Atualiza botões do tipo
      document.getElementById('btn-escolares').classList.toggle('ativo', tipoAtual === 'escolares');
      document.getElementById('btn-provas').classList.toggle('ativo', tipoAtual === 'provas');

      // Atualiza botões das classes (1 ao 9)
      for (let i = 1; i <= 9; i++) {
        const btn = document.getElementById(`c-${i}`);
        if (btn) btn.classList.toggle('ativo', i === classeAtual);
      }

      // Atualiza o Título
      const nomeTipo = tipoAtual === 'escolares' ? 'Horário Escolar' : 'Horário de Prova';
      document.getElementById('titulo-horario').innerText = `${nomeTipo} - ${classeAtual}ª Classe`;

      // Busca a imagem no registro
      const urlImagem = imagensHorarios[tipoAtual][classeAtual];
      const areaConteudo = document.getElementById('conteudo-horario');

      if (urlImagem && urlImagem.trim() !== "") {
        areaConteudo.innerHTML = `<img src="${urlImagem}" alt="Foto do Horário" class="img-horario" onerror="mostrarMensagemVazio()">`;
      } else {
        mostrarMensagemVazio();
      }
    }

    function mostrarMensagemVazio() {
      const areaConteudo = document.getElementById('conteudo-horario');
      areaConteudo.innerHTML = `
        <div class="sem-foto">
          <span>📷</span>
          Ainda não foi adicionado
        </div>
      `;
    }

    function selecionarTipo(tipo) {
      tipoAtual = tipo;
      atualizarTela();
    }

    function selecionarClasse(numero) {
      classeAtual = numero;
      atualizarTela();
    }

    function voltarMenu() {
      window.location.href = "escola.html";
    }

    // Inicializa a tela na primeira carregada
    atualizarTela();
  </script>

</body>
  </html>
