
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colégio Progresso - Portal do Aluno</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOPO BRANCO COM BORDA VERMELHA */
    header {
      background-color: #ffffff;
      border-bottom: 3px solid #dc2626;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #dc2626;
      background-color: #ffffff;
    }

    .school-info h1 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #dc2626;
      letter-spacing: 0.5px;
    }

    .school-info p {
      font-size: 0.75rem;
      color: #1e3a8a;
      font-weight: 700;
    }

    .btn-voltar {
      background-color: #dc2626;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* CONTEÚDO PRINCIPAL */
    main {
      flex: 1;
      padding: 20px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .welcome-card {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(220, 38, 38, 0.25);
    }

    .welcome-card h2 {
      font-size: 1.3rem;
      margin-bottom: 5px;
    }

    .welcome-card p {
      font-size: 0.85rem;
      opacity: 0.95;
    }

    .menu-title {
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* GRID DE MENU COM BORDAS VERMELHAS */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .menu-card {
      background-color: #ffffff;
      border: 2px solid #dc2626;
      border-radius: 14px;
      padding: 18px 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.04);
    }

    .menu-card:active {
      transform: scale(0.96);
      background-color: #fef2f2;
    }

    .menu-card .icon {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .menu-card h3 {
      font-size: 0.9rem;
      color: #0f172a;
      font-weight: 700;
    }

    /* CARD OCUPANDO LARGURA COMPLETA */
    .full-width {
      grid-column: span 2;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.75rem;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="logo-box">
      <img src="logo.png" alt="Logo Colégio Progresso" class="logo-img" onerror="this.src='https://via.placeholder.com/60?text=CP'">
      <div class="school-info">
        <h1>COLÉGIO PROGRESSO</h1>
        <p>Portal Informativo</p>
      </div>
    </div>

    <button class="btn-voltar" onclick="voltarParaLogin()">Sair</button>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main>
    <div class="welcome-card">
      <h2>Bem-vindo(a) ao Colégio Progresso! 🎓</h2>
      <p>Fique por dentro das novidades, informações gerais, avisos e horários.</p>
    </div>

    <div class="menu-title">Navegação Geral</div>

    <div class="menu-grid">
      <!-- Início -->
      <div class="menu-card" onclick="abrirSecao('inicio')">
        <div class="icon">🏫</div>
        <h3>Início</h3>
      </div>

      <!-- Novidades -->
      <div class="menu-card" onclick="abrirSecao('novidades')">
        <div class="icon">📰</div>
        <h3>Novidades</h3>
      </div>

      <!-- Avisos -->
      <div class="menu-card" onclick="abrirSecao('avisos')">
        <div class="icon">📢</div>
        <h3>Avisos</h3>
      </div>

      <!-- Horários -->
      <div class="menu-card" onclick="abrirSecao('horarios')">
        <div class="icon">⏰</div>
        <h3>Horários</h3>
      </div>

      <!-- Sugestões (Largura completa) -->
      <div class="menu-card full-width" onclick="abrirSecao('sugestoes')">
        <div class="icon">📬</div>
        <h3>Sugestões (Enviar E-mail)</h3>
      </div>
    </div>
  </main>

  <footer>
    &copy; Colégio Progresso - Todos os direitos reservados.
  </footer>

  <script>
    function abrirSecao(secao) {
      if (secao === 'sugestoes') {
        // Abre direto o aplicativo de e-mail do aluno
        window.location.href = "mailto:contato@colegioprogresso.com?subject=Sugestão - Colégio Progresso";
      } else {
        window.location.href = secao + ".html";
      }
    }

    function voltarParaLogin() {
      window.location.href = "../index.html";
    }
  </script>

</body>
</html>
